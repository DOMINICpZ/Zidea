<svg viewBox="0 0 680 680" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Zero Pattern Icon (Light)</title>
  <desc>Z pattern drawn through 3x3 dot grid on white background</desc>
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#1E1E1E" stop-opacity="1"/>
      <stop offset="15%" stop-color="#1E1E1E" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#1E1E1E" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#1E1E1E" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#1E1E1E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .z-line { stroke: #1E1E1E; fill: none; stroke-width: 16.1; stroke-linecap: round; stroke-linejoin: round; }
      .dot-on { fill: #1E1E1E; opacity: 0.85; }
      .dot-off { fill: #1E1E1E; opacity: 0.12; }
    </style>
  </defs>

  <path d="M85,85 L340,85 L595,85 L340,340 L85,595 L340,595 L595,595" class="z-line"/>

  <circle cx="85" cy="85" r="59.8" fill="url(#glow)"/>
  <circle cx="340" cy="85" r="59.8" fill="url(#glow)"/>
  <circle cx="595" cy="85" r="59.8" fill="url(#glow)"/>
  <circle cx="340" cy="340" r="59.8" fill="url(#glow)"/>
  <circle cx="85" cy="595" r="59.8" fill="url(#glow)"/>
  <circle cx="340" cy="595" r="59.8" fill="url(#glow)"/>
  <circle cx="595" cy="595" r="59.8" fill="url(#glow)"/>

  <circle cx="85" cy="85" r="11.5" class="dot-on"/>
  <circle cx="340" cy="85" r="11.5" class="dot-on"/>
  <circle cx="595" cy="85" r="11.5" class="dot-on"/>
  <circle cx="85" cy="340" r="9.2" class="dot-off"/>
  <circle cx="340" cy="340" r="11.5" class="dot-on"/>
  <circle cx="595" cy="340" r="9.2" class="dot-off"/>
  <circle cx="85" cy="595" r="11.5" class="dot-on"/>
  <circle cx="340" cy="595" r="11.5" class="dot-on"/>
  <circle cx="595" cy="595" r="11.5" class="dot-on"/>
</svg>
